// ============================================================
// CS2 AUTOEXEC v2 — максимальный FPS / минимальная задержка ввода
// Путь: ...\Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\autoexec.cfg
// В Steam: ПКМ по CS2 -> Свойства -> Параметры запуска -> -exec autoexec
// ============================================================

// --- Рендер / кадры -----------------------------------------------------
fps_max 0                    // без лимита (лучше для latency); при перегреве GPU поставьте под герцовку монитора минус 10%
engine_no_focus_sleep 0      // не засыпать в фоне (быстрый alt-tab)
mat_queue_mode 2             // принудительно многопоточный рендер (-1 = авто, обычно и так 2)
mat_powersavingsmode 0       // отключить энергосбережение движка

// --- NVIDIA Reflex (если RTX) -------------------------------------------
// reflex 1 = включён; проверьте в cl_showfps/overlay значение "Reflex: On+Boost"
reflex 1

// --- Сглаживание/качество: всё в производительность ----------------------
mat_antialias 0
mat_postprocess_scale 1.0
mat_monitorgamma 2.2
mat_motion_blur_enabled 0
mat_motion_blur_forward_enabled 0
mat_motion_blur_strength 0
r_drawtracers_firstperson 1   // по вкусу, почти не влияет
cl_detaildist 0               // устарело в CS2, безопасно
mat_luxels 0
mat_normalmaps 0              // NOTE: часть параметров mat_* игнорируется CS2 — оставлены как harmless legacy

// --- Networking (net latency) --------------------------------------------
cl_updaterate 128              // на 128-tick серверах (FACEIT/Community); на official 64tick игнорируется
cl_cmdrate 128
rate 786432                    // ~6.3 Mbps, запас для 128 tick
cl_interp_ratio 1
cl_interp 0                    // минимальный интерп = отзывчивость
cl_predict 1
cl_lagcompensation 1

// --- Input / Mouse --------------------------------------------------------
m_rawinput 1                   // сырой ввод мыши (обязательно!)
sensitivity 2.0                // подставьте свою
m_customaccel 0                // без акселерации
mouse_move_magnitude_clamp 0
cl_mouse_filtered_hold 1
zoom_sensitivity_ratio 1.0

// --- HUD / профилировка (не влияет на perf, но удобно) --------------------
cl_showfps 4                   // счётчик FPS + frame graph (0 = выкл)
net_graph 0
engine_low_latency_sleep_after_client_tick true   // ключевой low-latency тик CS2

// --- Загрузочные/прочее ---------------------------------------------------
host_writeconfig               // сохранить

echo "=== autoexec v2 loaded ==="
